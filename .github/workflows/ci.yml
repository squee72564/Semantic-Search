name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm lint:types
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm build

  upload-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: upload_test
          POSTGRES_PASSWORD: upload_test
          POSTGRES_DB: upload_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U upload_test -d upload_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://upload_test:upload_test@localhost:5432/upload_test
      DOCUMENT_UPLOAD_TEST_DATABASE_URL: postgresql://upload_test:upload_test@localhost:5432/upload_test
      DOCUMENT_UPLOAD_TEST_NON_PRODUCTION: "true"
      DOCUMENT_UPLOAD_INTEGRATION_TESTS: "true"
      PDF_VALIDATION_INTEGRATION_TESTS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: pnpm --filter @repo/db exec drizzle-kit migrate
      - run: pnpm --filter @repo/db exec vitest run src/unit_of_work/index.integration.test.ts
      - run: pnpm --filter @repo/api exec vitest run src/uploads/pdf.integration.test.ts
